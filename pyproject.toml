[project]
name = "local-llm-serve"
version = "0.1.2"
description = "OVMS, Ollama Vulkan and llama.cpp containers, and the models they serve"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.15"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
